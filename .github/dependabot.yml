version: 2
updates:
  # @qvac/* versions are contract pins (peer range plus primary devDependencies).
  # dev-next tracks npm latest through check:freshness, not Dependabot.
  # Zod's tested pin must match contracts.json runtime.zod.tested, so routine
  # version bumps are ignored. A security advisory can still open a pull request;
  # that pull request has to move the tested pin in the same change.
  # TypeScript and @types/node stay on the current major: CI tests Node 20 and 22,
  # and the TypeScript pin is 5.9.x.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "@qvac/*"
      - dependency-name: zod
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-production:
        dependency-type: production
      npm-tooling:
        patterns:
          - typescript
          - "@types/node"
          - tsx
      npm-transitive:
        patterns:
          - "*"
        exclude-patterns:
          - typescript
          - "@types/node"
          - tsx

  # Actions are pinned by commit SHA. One grouped pull request updates every
  # workflow that moved, including CodeQL init and analyze together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/London
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
