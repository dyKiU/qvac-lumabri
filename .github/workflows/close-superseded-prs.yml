name: Close superseded pull requests

# One-shot for the merge that limits Dependabot. The job matches that squash
# subject and then does nothing on later pushes. Delete this file after it runs.

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  close:
    if: contains(github.event.head_commit.message, 'Limit Dependabot to contract-safe dependency bumps')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close superseded pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          close_pr() {
            local number="$1"
            shift
            if gh pr close "$number" --repo "$GITHUB_REPOSITORY" "$@"; then
              echo "closed #$number"
            else
              echo "failed to close #$number" >&2
              failed=1
            fi
          }
          dependabot_comment='Closing so Dependabot can reopen routine updates as grouped pull requests. Contract pins (@qvac/*, routine Zod bumps, TypeScript majors, and @types/node majors) stay closed. See #70.'
          for n in 4 9 10 11 16 29 30 31 49 50 58 59 69; do
            close_pr "$n" --delete-branch --comment "$dependabot_comment"
          done
          autofix_comment='Closing because this head branch was removed. Its pins were superseded by #68.'
          for n in 44 45 46 47 48 53 54 55 56 57 61 62 63 64 65 66 67; do
            close_pr "$n" --comment "$autofix_comment"
          done
          exit "$failed"
