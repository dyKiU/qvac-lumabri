name: Auto-merge upstream autofix

# Queues squash merge after Upstream compatibility succeeds on a cursor/* pull request.
# Autofix PRs must match the Cursor agent that launched them.
# Pin-refresh PRs (cursor/upstream-pins-*) must carry the pin-refresh marker.
# Both may change only contracts.json, README.md, and native/lumabri-gateway-main.patch.
# Requires "Allow auto-merge" and secret CURSOR_API_KEY.

on:
  workflow_run:
    workflows: [Upstream compatibility]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  queue-merge:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CURSOR_API_KEY
        id: key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY not set; skipping auto-merge."
          fi

      - name: Resolve pull request
        if: steps.key.outputs.present == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ github.event.workflow_run.head_branch }}"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No open PR for branch ${branch}"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Queue auto-merge when eligible
        if: steps.key.outputs.present == 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          marker='<!-- upstream-autofix -->'
          view=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json \
            body,headRefName,isDraft,isCrossRepository,autoMergeRequest,files,url)
          body=$(echo "$view" | jq -r '.body // ""')
          head=$(echo "$view" | jq -r '.headRefName')
          draft=$(echo "$view" | jq -r '.isDraft')
          queued=$(echo "$view" | jq -r '.autoMergeRequest.enabled // false')
          pr_url=$(echo "$view" | jq -r '.url')

          cross=$(echo "$view" | jq -r '.isCrossRepository')
          if [ "$draft" = true ]; then
            echo "Draft PR; skipping"
            exit 0
          fi
          if [ "$cross" = true ]; then
            echo "Pull request head is from another repository; skipping"
            exit 0
          fi
          if [[ "$head" != cursor/* ]]; then
            echo "Head branch is not a Cursor agent branch; skipping"
            exit 0
          fi
          pin_refresh=false
          if grep -Fq '<!-- upstream-pin-refresh -->' <<< "$body"; then
            pin_refresh=true
          fi
          if [ "$pin_refresh" = false ] && ! grep -Fq "$marker" <<< "$body"; then
            echo "Missing upstream pin-refresh or autofix marker; skipping"
            exit 0
          fi
          if [ "$pin_refresh" = true ] && [[ "$head" != cursor/upstream-pins-* ]]; then
            echo "Pin refresh marker is only valid on cursor/upstream-pins-* branches; skipping"
            exit 0
          fi
          if [ "$pin_refresh" = false ]; then
            if ! grep -Fq '<!-- CURSOR_AGENT_PR_BODY_BEGIN -->' <<< "$body"; then
              echo "Missing Cursor agent PR body wrapper; skipping"
              exit 0
            fi
            merge_token=$(
              grep -Eo '<!-- upstream-autofix-token:[0-9a-f]{64} -->' <<< "$body" \
                | head -n 1 \
                | sed 's/<!-- upstream-autofix-token://;s/ -->//'
            )
            if [ -z "$merge_token" ]; then
              echo "Missing upstream autofix merge token; skipping"
              exit 0
            fi

            pr_url_encoded=$(jq -nr --arg u "$pr_url" '$u|@uri')
            agent_list=$(
              curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                "https://api.cursor.com/v1/agents?prUrl=${pr_url_encoded}&limit=20"
            )
            verified_agent_id=
            while IFS= read -r agent_id; do
              [ -n "$agent_id" ] || continue
              agent_json=$(
                curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                  "https://api.cursor.com/v1/agents/${agent_id}"
              )
              trigger=$(echo "$agent_json" | jq -r '.metadata.trigger // empty')
              token=$(echo "$agent_json" | jq -r '.metadata.mergeToken // empty')
              if [ "$trigger" = upstream-autofix ] && [ "$token" = "$merge_token" ]; then
                verified_agent_id=$agent_id
                latest_run_id=$(echo "$agent_json" | jq -r '.latestRunId // empty')
                break
              fi
            done < <(echo "$agent_list" | jq -r '.items[]?.id // empty')

            if [ -z "$verified_agent_id" ]; then
              echo "No upstream-autofix agent from this repo matches PR token; skipping"
              exit 0
            fi
            if ! grep -Fq "cursor.com/agents/${verified_agent_id}" <<< "$body"; then
              echo "PR body does not reference the verified Cursor agent; skipping"
              exit 0
            fi
            if [ -z "${latest_run_id:-}" ]; then
              echo "Verified agent has no run id yet; skipping"
              exit 0
            fi
            run_json=$(
              curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                "https://api.cursor.com/v1/agents/${verified_agent_id}/runs/${latest_run_id}"
            )
            branch_match=$(
              echo "$run_json" | jq -r --arg branch "$head" --arg pr "$pr_url" '
                [.git.branches[]?
                  | select(.branch == $branch and (.prUrl == $pr or .prUrl == null))
                ] | length > 0'
            )
            if [ "$branch_match" != true ]; then
              echo "Cursor agent run is not bound to this PR branch; skipping"
              exit 0
            fi
          fi

          mapfile -t changed < <(echo "$view" | jq -r '.files[].path')
          allowed=(
            contracts.json
            README.md
            native/lumabri-gateway-main.patch
          )
          for path in "${changed[@]}"; do
            ok=false
            for entry in "${allowed[@]}"; do
              if [ "$path" = "$entry" ]; then
                ok=true
                break
              fi
            done
            if [ "$ok" = false ]; then
              echo "Out-of-scope file for auto-merge: $path" >&2
              exit 1
            fi
          done

          if [ "$queued" = true ]; then
            echo "Auto-merge already queued for PR #${PR_NUMBER}"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          echo "Queued squash auto-merge for upstream autofix PR #${PR_NUMBER}"
