name: Auto-merge upstream autofix

# Queues squash merge after Upstream compatibility succeeds on a cursor/* pull request.
# Autofix PRs must match the Cursor agent that launched them.
# Pin-refresh PRs (cursor/upstream-pins-*) must carry the pin-refresh marker.
# Both may change only contracts.json, README.md, and native/lumabri-gateway-main.patch.
# A change to the gateway patch must be a pure rebase: scripts/check-gateway-patch-content.mts
# compares the PR head patch with its merge base and rejects any changed +/- content line.
# Ineligible PRs are never merged and the run still succeeds: the reasons go to the job
# summary, the PR gets the autofix:needs-human label, and one comment per distinct reason set.
# Requires "Allow auto-merge" and secret CURSOR_API_KEY.

on:
  workflow_run:
    workflows: [Upstream compatibility]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  queue-merge:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CURSOR_API_KEY
        id: key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY not set; skipping auto-merge."
          fi

      - name: Resolve pull request
        if: steps.key.outputs.present == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ github.event.workflow_run.head_branch }}"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No open PR for branch ${branch}"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out trusted tooling from the default branch
        if: steps.key.outputs.present == 'true' && steps.pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        if: steps.key.outputs.present == 'true' && steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install trusted tooling
        if: steps.key.outputs.present == 'true' && steps.pr.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Queue auto-merge when eligible
        if: steps.key.outputs.present == 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          marker='<!-- upstream-autofix -->'
          patch_path=native/lumabri-gateway-main.patch
          review_label='autofix:needs-human'
          review_marker='<!-- upstream-autofix-needs-human -->'
          view=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json \
            body,headRefName,isDraft,isCrossRepository,autoMergeRequest,files,url)
          body=$(echo "$view" | jq -r '.body // ""')
          head=$(echo "$view" | jq -r '.headRefName')
          draft=$(echo "$view" | jq -r '.isDraft')
          queued=$(echo "$view" | jq -r '.autoMergeRequest.enabled // false')
          pr_url=$(echo "$view" | jq -r '.url')

          cross=$(echo "$view" | jq -r '.isCrossRepository')
          if [ "$draft" = true ]; then
            echo "Draft PR; skipping"
            exit 0
          fi
          if [ "$cross" = true ]; then
            echo "Pull request head is from another repository; skipping"
            exit 0
          fi
          if [[ "$head" != cursor/* ]]; then
            echo "Head branch is not a Cursor agent branch; skipping"
            exit 0
          fi
          pin_refresh=false
          if grep -Fq '<!-- upstream-pin-refresh -->' <<< "$body"; then
            pin_refresh=true
          fi
          if [ "$pin_refresh" = false ] && ! grep -Fq "$marker" <<< "$body"; then
            echo "Missing upstream pin-refresh or autofix marker; skipping"
            exit 0
          fi
          if [ "$pin_refresh" = true ] && [[ "$head" != cursor/upstream-pins-* ]]; then
            echo "Pin refresh marker is only valid on cursor/upstream-pins-* branches; skipping"
            exit 0
          fi
          if [ "$pin_refresh" = false ]; then
            if ! grep -Fq '<!-- CURSOR_AGENT_PR_BODY_BEGIN -->' <<< "$body"; then
              echo "Missing Cursor agent PR body wrapper; skipping"
              exit 0
            fi
            merge_token=$(
              grep -Eo '<!-- upstream-autofix-token:[0-9a-f]{64} -->' <<< "$body" \
                | head -n 1 \
                | sed 's/<!-- upstream-autofix-token://;s/ -->//'
            )
            if [ -z "$merge_token" ]; then
              echo "Missing upstream autofix merge token; skipping"
              exit 0
            fi

            pr_url_encoded=$(jq -nr --arg u "$pr_url" '$u|@uri')
            agent_list=$(
              curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                "https://api.cursor.com/v1/agents?prUrl=${pr_url_encoded}&limit=20"
            )
            verified_agent_id=
            while IFS= read -r agent_id; do
              [ -n "$agent_id" ] || continue
              agent_json=$(
                curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                  "https://api.cursor.com/v1/agents/${agent_id}"
              )
              trigger=$(echo "$agent_json" | jq -r '.metadata.trigger // empty')
              token=$(echo "$agent_json" | jq -r '.metadata.mergeToken // empty')
              if [ "$trigger" = upstream-autofix ] && [ "$token" = "$merge_token" ]; then
                verified_agent_id=$agent_id
                latest_run_id=$(echo "$agent_json" | jq -r '.latestRunId // empty')
                break
              fi
            done < <(echo "$agent_list" | jq -r '.items[]?.id // empty')

            if [ -z "$verified_agent_id" ]; then
              echo "No upstream-autofix agent from this repo matches PR token; skipping"
              exit 0
            fi
            if ! grep -Fq "cursor.com/agents/${verified_agent_id}" <<< "$body"; then
              echo "PR body does not reference the verified Cursor agent; skipping"
              exit 0
            fi
            if [ -z "${latest_run_id:-}" ]; then
              echo "Verified agent has no run id yet; skipping"
              exit 0
            fi
            run_json=$(
              curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
                "https://api.cursor.com/v1/agents/${verified_agent_id}/runs/${latest_run_id}"
            )
            branch_match=$(
              echo "$run_json" | jq -r --arg branch "$head" --arg pr "$pr_url" '
                [.git.branches[]?
                  | select(.branch == $branch and (.prUrl == $pr or .prUrl == null))
                ] | length > 0'
            )
            if [ "$branch_match" != true ]; then
              echo "Cursor agent run is not bound to this PR branch; skipping"
              exit 0
            fi
          fi

          mapfile -t changed < <(echo "$view" | jq -r '.files[].path')
          allowed=(
            contracts.json
            README.md
            "$patch_path"
          )
          reasons=()
          for path in "${changed[@]}"; do
            ok=false
            for entry in "${allowed[@]}"; do
              if [ "$path" = "$entry" ]; then
                ok=true
                break
              fi
            done
            if [ "$ok" = false ]; then
              reasons+=("Out-of-scope file for auto-merge: \`$path\`")
            fi
          done

          if grep -Fq "$review_marker" <<< "$body"; then
            reasons+=("The agent marked this PR for human review (\`$review_marker\` in the PR body).")
          fi

          patch_changed=false
          for path in "${changed[@]}"; do
            if [ "$path" = "$patch_path" ]; then
              patch_changed=true
            fi
          done
          if [ "$patch_changed" = true ]; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
            head_sha=$(git rev-parse FETCH_HEAD)
            if [ "$head_sha" != "$VERIFIED_SHA" ]; then
              echo "PR head ${head_sha} is not the verified commit ${VERIFIED_SHA}; waiting for the next Upstream compatibility run"
              exit 0
            fi
            merge_base=$(git merge-base origin/main "$head_sha")
            if ! git show "${merge_base}:${patch_path}" > "$RUNNER_TEMP/patch-base" 2>/dev/null; then
              reasons+=("\`$patch_path\` does not exist at the merge base, so its content cannot be compared.")
            elif ! git show "${head_sha}:${patch_path}" > "$RUNNER_TEMP/patch-head" 2>/dev/null; then
              reasons+=("\`$patch_path\` was deleted by this PR.")
            elif ! patch_report=$(node --import tsx scripts/check-gateway-patch-content.mts \
              --base "$RUNNER_TEMP/patch-base" --head "$RUNNER_TEMP/patch-head"); then
              reasons+=("Gateway patch content changed; agents may only rebase \`$patch_path\` (context, offsets, hunk headers), never edit its own +/- lines. Details:"$'\n\n~~~~\n'"${patch_report}"$'\n~~~~')
            else
              echo "$patch_report"
            fi
          fi

          if [ "${#reasons[@]}" -gt 0 ]; then
            reason_text=
            for reason in "${reasons[@]}"; do
              reason_text+="- ${reason}"$'\n'
            done
            {
              echo "### Auto-merge skipped for PR #${PR_NUMBER}: human review needed"
              echo
              printf '%s' "$reason_text"
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Auto-merge skipped for PR #%s:\n%s' "$PR_NUMBER" "$reason_text"

            if [ "$queued" = true ]; then
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
              echo "Disabled previously queued auto-merge for PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            fi

            gh label create "$review_label" --repo "$GITHUB_REPOSITORY" --color D93F0B \
              --description "Upstream autofix PR needs a human before merge" 2>/dev/null || true
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=${review_label}" > /dev/null

            digest=$(printf '%s' "$reason_text" | sha256sum | cut -c1-12)
            comment_marker="<!-- upstream-automerge-review:${digest} -->"
            existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body')
            if grep -Fq "$comment_marker" <<< "$existing"; then
              echo "Review comment for this reason set already posted"
            else
              comment=$(
                printf '**Auto-merge skipped: human review needed.**\n\n%s\n%s\n' "$reason_text" "$comment_marker"
              )
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="$comment" > /dev/null
            fi
            exit 0
          fi

          if [ "$queued" = true ]; then
            echo "Auto-merge already queued for PR #${PR_NUMBER}"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          echo "Queued squash auto-merge for upstream autofix PR #${PR_NUMBER}"
          echo "Queued squash auto-merge for PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
