name: Release check

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Match tag to package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check
      - run: npm run bundle && npm run verify:bundle
      - run: npm run bundle:cli && npm run verify:bundle
      - run: npm run test:qvac
      - name: Build package and SBOM
        run: |
          npm pack
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            *.tgz
            sbom.cdx.json
