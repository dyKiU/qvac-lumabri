name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve pinned versions
    runs-on: ubuntu-latest
    outputs:
      lumabri_ref: ${{ steps.refs.outputs.lumabri_ref }}
      colibri_ref: ${{ steps.refs.outputs.colibri_ref }}
      qvac_ref: ${{ steps.refs.outputs.qvac_ref }}
      numpy: ${{ steps.refs.outputs.numpy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: refs
        shell: bash
        run: |
          echo "lumabri_ref=$(node -p "require('./compatibility.json').lumabri.sourceRef")" >> "$GITHUB_OUTPUT"
          echo "colibri_ref=$(node -p "require('./compatibility.json').colibri.sourceRef")" >> "$GITHUB_OUTPUT"
          echo "qvac_ref=$(node -p "require('./compatibility.json').qvac.sourceRef")" >> "$GITHUB_OUTPUT"
          echo "numpy=$(node -p "require('./compatibility.json').verification.numpy")" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check

  package:
    name: Package surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run pack:check

  qvac-published:
    name: Published QVAC bundle and RPC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - run: npm run verify:bundle
      - run: npm run bundle:cli
      - run: npm run verify:bundle
      - run: npm run test:qvac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qvac-worker
          path: |
            qvac/worker.entry.mjs
            qvac/worker.bundle.js
            qvac/addons.manifest.json

  native-gateway:
    name: Lumabri gateway / ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned Lumabri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/lumabri
          ref: ${{ needs.versions.outputs.lumabri_ref }}
          path: upstream/lumabri
      - run: adapter/scripts/apply-lumabri-gateway.sh upstream/lumabri
      - run: make -C upstream/lumabri lumabri
      - run: upstream/lumabri/gateway_test.sh

  native-moe:
    name: Lumabri chatter and expert peers
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned Lumabri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/lumabri
          ref: ${{ needs.versions.outputs.lumabri_ref }}
          path: upstream/lumabri
      - name: Checkout pinned Colibri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/colibri
          ref: ${{ needs.versions.outputs.colibri_ref }}
          path: upstream/colibri
      - run: adapter/scripts/apply-lumabri-gateway.sh upstream/lumabri
      - name: Build model host and expert-node sides
        run: make -C upstream/lumabri lumabri liblumabri.so colibri_p2p expert_node_glm ENGINE=../colibri/c
      - name: Prove local and RPC expert outputs match
        shell: bash
        run: |
          python3 -m venv .verification-venv
          .verification-venv/bin/pip install --disable-pip-version-check numpy==${{ needs.versions.outputs.numpy }}
          PATH="$PWD/.verification-venv/bin:$PATH" make -C upstream/lumabri test-phase2 ENGINE=../colibri/c

  qvac-source:
    name: Pinned QVAC source build
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned QVAC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tetherto/qvac
          ref: ${{ needs.versions.outputs.qvac_ref }}
          path: upstream/qvac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build and pack QVAC SDK
        working-directory: upstream/qvac/packages/sdk
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install source-built SDK
        working-directory: adapter
        run: npm install --no-save "$RUNNER_TEMP"/qvac-sdk-*.tgz
      - run: npm run bundle && npm run verify:bundle && npm run test:qvac
        working-directory: adapter
