name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Resolve contract matrix
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.matrix.outputs.supported }}
      node: ${{ steps.matrix.outputs.node }}
      numpy: ${{ steps.matrix.outputs.numpy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - id: matrix
        shell: bash
        run: |
          echo "supported=$(node scripts/list-contracts.mjs supported)" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "JSON.stringify(require('./contracts.json').runtime.node.tested)")" >> "$GITHUB_OUTPUT"
          echo "numpy=$(node -p "require('./contracts.json').runtime.numpy")" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ${{ fromJSON(needs.contracts.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Package surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:check

  qvac-published:
    name: Published QVAC bundle and RPC / ${{ matrix.contract.id }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.supported) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install contract QVAC versions
        run: npm install --no-save --package-lock=false "@qvac/sdk@${{ matrix.contract.qvac.sdk }}" "@qvac/cli@${{ matrix.contract.qvac.cli }}"
      - run: npm run bundle
      - run: npm run verify:bundle
      - run: npm run bundle:cli
      - run: npm run verify:bundle
      - run: npm run test:qvac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qvac-worker-${{ matrix.contract.id }}
          path: |
            qvac/worker.entry.mjs
            qvac/worker.bundle.js
            qvac/addons.manifest.json

  native-gateway:
    name: Lumabri gateway / ${{ matrix.contract.id }} / ${{ matrix.os }}
    needs: contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.supported) }}
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned Lumabri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/lumabri
          ref: ${{ matrix.contract.lumabri.sourceRef }}
          path: upstream/lumabri
      - run: adapter/scripts/apply-lumabri-gateway.sh upstream/lumabri "${{ matrix.contract.lumabri.gatewayPatch }}"
      - run: make -C upstream/lumabri lumabri
      - run: upstream/lumabri/gateway_test.sh

  native-moe:
    name: Lumabri chatter and expert peers / ${{ matrix.contract.id }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.supported) }}
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned Lumabri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/lumabri
          ref: ${{ matrix.contract.lumabri.sourceRef }}
          path: upstream/lumabri
      - name: Checkout pinned Colibri
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/colibri
          ref: ${{ matrix.contract.colibri.sourceRef }}
          path: upstream/colibri
      - run: adapter/scripts/apply-lumabri-gateway.sh upstream/lumabri "${{ matrix.contract.lumabri.gatewayPatch }}"
      - name: Build model host and expert-node sides
        run: make -C upstream/lumabri lumabri liblumabri.so colibri_p2p expert_node_glm ENGINE=../colibri/c
      - name: Prove local and RPC expert outputs match
        shell: bash
        run: |
          python3 -m venv .verification-venv
          .verification-venv/bin/pip install --disable-pip-version-check numpy==${{ needs.contracts.outputs.numpy }}
          PATH="$PWD/.verification-venv/bin:$PATH" make -C upstream/lumabri test-phase2 ENGINE=../colibri/c

  qvac-source:
    name: Pinned QVAC source build / ${{ matrix.contract.id }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.supported) }}
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout pinned QVAC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tetherto/qvac
          ref: ${{ matrix.contract.qvac.sourceRef }}
          path: upstream/qvac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Build and pack QVAC SDK
        working-directory: upstream/qvac/packages/sdk
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.dependencies?.['@qvac/inference'] ? 0 : 1)"; then
            pushd ../inference
            bun install
            bun x tsc --project tsconfig.build.json --noCheck
            bun run postcompile:aliases
            bun pm pack --destination "$RUNNER_TEMP"
            popd
            bun install
            bun x tsc --project tsconfig.json --noCheck
            bun run postcompile:aliases
            bun pm pack --destination "$RUNNER_TEMP"
          else
            npm install --ignore-scripts --no-audit --no-fund
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP"
          fi
      - name: Install source-built SDK
        working-directory: adapter
        run: |
          packages=("$RUNNER_TEMP"/qvac-sdk-*.tgz)
          if compgen -G "$RUNNER_TEMP/qvac-inference-*.tgz" > /dev/null; then
            packages+=("$RUNNER_TEMP"/qvac-inference-*.tgz)
          fi
          npm install --no-save "${packages[@]}"
      - run: npm run bundle && npm run verify:bundle && npm run test:qvac
        working-directory: adapter
