name: Upstream autofix

# Launches a Cursor Cloud Agent when the upstream canary fails on main.
# Repository secret: CURSOR_API_KEY (Cursor Dashboard → API Keys).
#
# Triggers:
# - workflow_run: after "Upstream compatibility" completes with failure on main.
# - workflow_dispatch: manual test or re-launch (see inputs below).
#
# Manual dispatch (Actions → Upstream autofix → Run workflow):
# - Leave upstream_run_id empty to use the latest failed Upstream compatibility run on main.
# - Set force_launch=true to call the Cursor API without requiring a failed upstream run
#   (useful to verify CURSOR_API_KEY; uses a minimal test prompt, autoCreatePR: false).
#
# End-to-end path after a real upstream failure (no extra agent launches required to read):
#   Upstream compatibility (fail on main) → workflow_run → this workflow → agent PR
#   → Verify (pass) → Auto-merge upstream autofix (CURSOR_API_KEY + token metadata).
# See docs/lumabri-gateway-patch.md § Autofix automation.
# Agent model: CURSOR_AGENT_MODEL → POST /v1/agents body `model.id` (see Cursor Cloud Agents API docs).

env:
  CURSOR_AGENT_MODEL: composer-2.5

on:
  workflow_run:
    workflows: [Upstream compatibility]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Upstream compatibility run ID (optional; latest failed on main if empty)
        required: false
        type: string
      force_launch:
        description: Skip upstream failure check (manual API key / launch test only)
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: upstream-autofix-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  launch-fix-agent:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve upstream workflow run
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "run_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
            echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force_launch }}" = true ]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "run_url=(manual force_launch — no upstream run)" >> "$GITHUB_OUTPUT"
            echo "conclusion=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id="${{ inputs.upstream_run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow upstream.yml --branch main --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "failure")][0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No failed Upstream compatibility run found on main. Pass upstream_run_id or set force_launch=true."
            exit 1
          fi
          run_url=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          if [ "$conclusion" != failure ]; then
            echo "::error::Run ${run_id} conclusion is ${conclusion}, not failure. Set force_launch=true to override."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Require CURSOR_API_KEY
        id: key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "::error::CURSOR_API_KEY is not configured on this repository."
            exit 1
          fi
          echo "CURSOR_API_KEY not set; skipping autofix agent launch."

      - name: Collect failed upstream logs
        id: logs
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.upstream.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            echo "failed_jobs=(manual test)" >> "$GITHUB_OUTPUT"
            echo "Manual force_launch: no upstream log collection."
            exit 0
          fi
          failed_jobs=$(
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")'
          )
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            | tail -n 250 > failed-log.txt
          {
            echo "failed_jobs=$failed_jobs"
            echo "run_url=${{ steps.upstream.outputs.run_url }}"
          } >> "$GITHUB_OUTPUT"

      - name: Launch Cursor Cloud Agent
        if: steps.key.outputs.present == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO_URL: https://github.com/${{ github.repository }}
          RUN_URL: ${{ steps.logs.outputs.run_url || steps.upstream.outputs.run_url }}
          FAILED_JOBS: ${{ steps.logs.outputs.failed_jobs }}
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          FORCE_LAUNCH: ${{ inputs.force_launch }}
        run: |
          set -euo pipefail
          merge_token=$(openssl rand -hex 32)
          if [ "$FORCE_LAUNCH" = true ] && [ -z "$UPSTREAM_RUN_ID" ]; then
            prompt=$(
              cat <<EOF
          Manual Upstream autofix workflow_dispatch test for ${REPO_URL}.

          This is a connectivity test only. Do not open a pull request.
          Reply with a single line: upstream-autofix manual dispatch ok

          EOF
            )
            jq -n \
              --arg text "$prompt" \
              --arg url "$REPO_URL" \
              --arg merge_token "$merge_token" \
              --arg model "$CURSOR_AGENT_MODEL" \
              '{
                name: "Upstream autofix manual test",
                prompt: { text: $text },
                model: { id: $model },
                repos: [{ url: $url, startingRef: "main" }],
                autoCreatePR: false,
                metadata: {
                  trigger: "upstream-autofix-manual",
                  mergeToken: $merge_token
                }
              }' > agent-request.json
          else
            prompt=$(
              cat <<EOF
          The scheduled Upstream compatibility workflow failed on main for ${REPO_URL}.

          Failed jobs: ${FAILED_JOBS}
          Workflow run: ${RUN_URL}

          Fix upstream compatibility for this repository:
          - Refresh candidate pins in contracts.json when Lumabri, Colibri, or QVAC releases moved.
          - Rebase native/lumabri-gateway-main.patch if Lumabri main changed.
          - Keep README contract markers in sync (npm run docs:contracts).
          - Follow AGENTS.md: minimal scope, run npm run check and npm run check:hygiene before opening a PR.
          - Create a branch named cursor/upstream-compat-29e5 (or cursor/<short-topic>-29e5) off main.
          - PR title must start with "Refresh upstream compatibility".
          - PR description must include these exact markers on their own lines:
            <!-- upstream-autofix -->
            <!-- upstream-autofix-token:${merge_token} -->

          Recent failure log (tail):

          $(cat failed-log.txt)
          EOF
            )
            jq -n \
              --arg text "$prompt" \
              --arg url "$REPO_URL" \
              --arg run_id "$UPSTREAM_RUN_ID" \
              --arg run_url "$RUN_URL" \
              --arg merge_token "$merge_token" \
              --arg model "$CURSOR_AGENT_MODEL" \
              '{
                name: "Upstream compat autofix",
                prompt: { text: $text },
                model: { id: $model },
                repos: [{ url: $url, startingRef: "main" }],
                autoCreatePR: true,
                metadata: {
                  trigger: "upstream-autofix",
                  workflowRunId: $run_id,
                  workflowRunUrl: $run_url,
                  mergeToken: $merge_token
                }
              }' > agent-request.json
          fi
          response=$(
            curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" \
              -H 'Content-Type: application/json' \
              -d @agent-request.json \
              https://api.cursor.com/v1/agents
          )
          echo "$response" | jq .
          agent_id=$(echo "$response" | jq -r '.agent.id // empty')
          run_id=$(echo "$response" | jq -r '.run.id // empty')
          if [ -z "$agent_id" ] || [ -z "$run_id" ]; then
            echo "Cursor API response did not include agent/run ids" >&2
            exit 1
          fi
          echo "Launched agent ${agent_id} (run ${run_id})"
