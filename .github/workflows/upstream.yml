name: Upstream compatibility

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility
  cancel-in-progress: true

jobs:
  contracts:
    name: Resolve canary contracts
    runs-on: ubuntu-latest
    outputs:
      canaries: ${{ steps.matrix.outputs.canaries }}
      numpy: ${{ steps.matrix.outputs.numpy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - id: matrix
        shell: bash
        run: |
          echo "canaries=$(node scripts/list-contracts.mjs candidate edge)" >> "$GITHUB_OUTPUT"
          echo "numpy=$(node -p "require('./contracts.json').runtime.numpy")" >> "$GITHUB_OUTPUT"

  candidate-freshness:
    name: Candidate release freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run check:freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lumabri-colibri:
    name: Lumabri + Colibri / ${{ matrix.contract.id }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.canaries) }}
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout Lumabri contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/lumabri
          ref: ${{ matrix.contract.lumabri.sourceRef }}
          path: upstream/lumabri
      - name: Checkout Colibri contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustVugg/colibri
          ref: ${{ matrix.contract.colibri.sourceRef }}
          path: upstream/colibri
      - run: adapter/scripts/apply-lumabri-gateway.sh upstream/lumabri
      - run: make -C upstream/lumabri lumabri liblumabri.so colibri_p2p expert_node_glm ENGINE=../colibri/c
      - run: upstream/lumabri/gateway_test.sh
      - name: Prove local and RPC expert outputs match
        shell: bash
        run: |
          python3 -m venv .verification-venv
          .verification-venv/bin/pip install --disable-pip-version-check numpy==${{ needs.contracts.outputs.numpy }}
          PATH="$PWD/.verification-venv/bin:$PATH" make -C upstream/lumabri test-phase2 ENGINE=../colibri/c

  qvac:
    name: QVAC SDK / ${{ matrix.contract.id }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.contracts.outputs.canaries) }}
    steps:
      - name: Checkout adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      - name: Checkout QVAC contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tetherto/qvac
          ref: ${{ matrix.contract.qvac.sourceRef }}
          path: upstream/qvac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Build and pack upstream SDK
        working-directory: upstream/qvac/packages/sdk
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.dependencies?.['@qvac/inference'] ? 0 : 1)"; then
            bun install
            bun run build
            bun pm pack --destination "$RUNNER_TEMP"
          else
            npm install --ignore-scripts --no-audit --no-fund
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP"
          fi
      - name: Exercise adapter against upstream SDK
        working-directory: adapter
        run: |
          npm install --no-save "$RUNNER_TEMP"/qvac-sdk-*.tgz
          npm run check
          npm run bundle
          npm run verify:bundle
          npm run test:qvac
